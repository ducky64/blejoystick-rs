[package]
name = "logic"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[features]
defmt = ["dep:defmt", "rmk-types/defmt"]

[dependencies]
fixed = "1.30.0"
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = [
  "experimental-derive",
] }
defmt = { version = "1.0", optional = true }

rmk-types = { version = "0.4", default-features = false } # for VIAL definitions
