# based on https://github.com/ch32-rs/ch32-hal/blob/main/examples/ch32v003

[package]
name = "ch32v003-ioexpander"
version = "0.1.0"
edition = "2024"

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", features = [
    "ch32v003f4p6",
    "memory-x",
    "embassy",
    "time-driver-tim2",
    "rt",
] }
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"

# This is okay because we should automatically use whatever ch32-hal uses
qingke = "0.7"
qingke-rt = "0.7"

defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-halt = "1.0"

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

smart-leds = "0.4.0"
ws2812-spi = { version = "0.5.1" }

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
lto = true
opt-level = "z" # Optimize for size.

[profile.dev]
strip = false
lto = true
opt-level = "z"
