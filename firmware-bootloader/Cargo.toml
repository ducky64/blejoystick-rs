[package]
edition = "2021"
name = "blejoystick-bootloader"
rust-version = "1.86"
version = "0.1.0"

[dependencies]
embassy-nrf = { version = "0.11", default-features = false, features = [
  "defmt",
  "nrf52840",
  "rt",
] }
embassy-boot-nrf = { version = "0.12", features = ["defmt"] }
embassy-sync = "0.8"

cortex-m = { version = "0.7.6", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"

defmt = "1.0"
defmt-rtt = { version = "1.0", features = ["disable-blocking-mode"] }

[profile.dev]
opt-level = "s"
debug = 2

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
