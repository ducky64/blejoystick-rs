[package]
edition = "2021"
name = "blejoystick-rs"
rust-version = "1.86"
version = "0.1.0"

[[bin]]
name = "blejoystick-rs"
path = "./src/main.rs"

[dependencies]

# Cargo.toml block from trouble nrf52 example

embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-time = { version = "0.5", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", default-features = false, features = ["defmt", "time-driver-rtc1", "gpiote", "unstable-pac", "rt", "nrf52840", "nfc-pins-as-gpio"] }
embassy-futures = "0.1.1"
embassy-sync = { version = "0.8", features = ["defmt"] }

futures = { version = "0.3", default-features = false, features = ["async-await"]}
nrf-sdc = { version = "0.4", default-features = false, features = ["defmt", "peripheral", "nrf52840"] }
nrf-mpsl = { version = "0.3", default-features = false, features = ["defmt", "critical-section-impl", "nrf52840"] }
bt-hci = { version = "0.10", default-features = false, features = ["defmt"] }
trouble-host = { version = "0.8", default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool"] }

defmt = "1.0"
defmt-rtt = { version = "1.0", features=["disable-blocking-mode"] }
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"
static_cell = "2"

# end Cargo.toml block from trouble nrf52 example

heapless = { version = "0.9", features = ["serde"] }
strum = { version = "0.27", features = ["derive"], default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
ssmarshal = { version = "1.0", default-features = false }                     # for packing BLE wire formats

fixed = { version = "1.30.0", features = ["defmt"] }

# for BLE 'security' feature
sequential-storage = { version = "8.0", features = [
    "postcard",
], default-features = false }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

# for 'ble_bas_peripheral_bonding'
portable-atomic = "1"

embassy-embedded-hal = "0.6.0"
# peripherals
# embedded-hal = "1.0"
embedded-hal-async = "1.0"

usbd-hid = "0.10.1"

ina219 = { version = "0.2", features = ["defmt"] }
qmc5883p = { version = "1.0", features = ["defmt"] }
lsm6ds3trc = { version = "0.1", features = ["defmt"] }

smart-leds = "0.4.0"

# application
micromath = "2.1"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[patch.crates-io]
# note: to build on Windows, symlink support must be enabled for git
# if you just enabled symlinks, you may need to delete your ~/.cargo/git/checkouts/nrf-sdc folder to require it be re-cloned
# https://github.com/alexmoon/nrf-sdc/issues/84
# a crates.io release hasn't happened for a long while
# nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "1a6e661155cdd1d6a86f3ae7b7fb117343781533"}
# nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "1a6e661155cdd1d6a86f3ae7b7fb117343781533"}
