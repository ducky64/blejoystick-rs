[package]
name = "vial-device"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Device-side VIA / Vial keyboard configuration protocol: no_std command handler, raw HID report descriptor, and build-time definition compression"

[features]
build = [
  "dep:serde_json",
  "dep:xz2",
] ## std required, use from [build-dependencies] only
defmt = ["dep:defmt", "rmk-types/defmt"]

[dependencies]
rmk-types = { version = "0.4", default-features = false } # command enums and protocol versions
defmt = { version = "1.0", optional = true }

serde_json = { version = "1", optional = true }
xz2 = { version = "0.1", optional = true }

[dev-dependencies]
usbd-hid = "0.10"
